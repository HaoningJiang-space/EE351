<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Game Store{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
        <div class="logo">
            <a href="{{ url_for('home') }}">Logo</a>
        </div>
        <div class="nav-links">
            <a href="{{ url_for('store') }}">Store</a>
            <div class="user-menu">
                <span>Username</span>
                <a href="{{ url_for('user_profile') }}">Homepage</a>
                <a href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>
    <!-- Main Content -->
    <div class="content">
        {% block content %}{% endblock %}
    </div>
    <!-- Footer -->
    <footer>
        <p>&copy; 2024 Game Store. All rights reserved.</p>
        <p><a href="#">About Us</a> | <a href="#">Contact</a></p>
    </footer>
</body>
</html>
