{% extends 'base.html' %}
{% block title %}Store{% endblock %}
{% block content %}
    <h2>All Games</h2>
    <!-- Filter Bar -->
    <div class="filter-bar">
        <!-- Filter options -->
    </div>
    <!-- Game List -->
    <div class="game-grid">
        {% for game in games %}
        <div class="game-card">
            <img src="{{ url_for('static', filename=game.cover_url) }}" alt="Game Cover">
            <h3>{{ game.name }}</h3>
            <p>Category: {{ game.category }}</p>
            <a href="{{ url_for('game_detail', game_id=game.id) }}">View Details</a>
        </div>
        {% endfor %}
    </div>
{% endblock %}
