{% extends 'base.html' %}
{% block title %}{{ game.name }}{% endblock %}
{% block content %}
    <div class="game-detail">
        <div class="game-header">
            <img src="{{ url_for('static', filename=game.cover_url) }}" alt="Game Cover" class="game-cover">
            <div class="game-info">
                <h2>{{ game.name }}</h2>
                <p class="game-price">Price: ${{ game.price }}</p>
                <p class="game-description">{{ game.description }}</p>
            </div>
        </div>
        <!-- Screenshots, comments, etc. -->
        <div class="game-extra">
            <h3>Screenshots</h3>
            <div class="screenshots">
                <!-- 示例截图 -->
                <img src="{{ url_for('static', filename='screenshot1.jpg') }}" alt="Screenshot 1">
                <img src="{{ url_for('static', filename='screenshot2.jpg') }}" alt="Screenshot 2">
            </div>
            <h3>Comments</h3>
            <div class="comments">
                <p>No comments yet. Be the first to comment!</p>
            </div>
        </div>
    </div>
{% endblock %}
