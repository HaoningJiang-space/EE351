{% extends 'base.html' %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
    <div class="edit-profile">
        <h2>Edit Your Profile</h2>
        <form method="POST" enctype="multipart/form-data">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" value="{{ user.username }}" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ user.email }}" required>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" value="{{ user.address }}" required>

            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" name="phone" value="{{ user.phone }}" required>

            <label for="membership_level">Membership Level:</label>
            <select id="membership_level" name="membership_level">
                <option value="Bronze" {% if user.membership_level == 'Bronze' %}selected{% endif %}>Bronze</option>
                <option value="Silver" {% if user.membership_level == 'Silver' %}selected{% endif %}>Silver</option>
                <option value="Gold" {% if user.membership_level == 'Gold' %}selected{% endif %}>Gold</option>
                <option value="Platinum" {% if user.membership_level == 'Platinum' %}selected{% endif %}>Platinum</option>
            </select>

            <label for="profile_picture">Profile Picture:</label>
            <input type="file" id="profile_picture" name="profile_picture" accept="image/*">

            <button type="submit">Save Changes</button>
        </form>
    </div>
{% endblock %}
